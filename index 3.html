<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>낙원정신병동 갤러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 촘촘한 모바일 갤러리 목록. 헤더 36px 검색 → 메뉴 → 제목줄 → 탭 → 말머리 → 고정 공지 → 글 목록(우측 댓글 열) */
:root {
  --bg: #eef1ef;
  --surface: #ffffff;
  --ink: #1b2522;
  --muted: #8a9690;
  --line: #e1e6e3;
  --head: #1f5b52;
  --head2: #276b60;
  --head-ink: #ffffff;
  --brand: #1f5b52;
  --notice: #d03a2c;
  --hot: #e8590c;
  --tint: #f0f3f1;
  --font-display: "Black Han Sans", "Noto Sans KR", sans-serif;
  --font-body: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111715; --surface: #18201d; --ink: #e5ebe8; --muted: #8b9993; --line: #2a3531;
    --head: #15302b; --head2: #1b3d36; --head-ink: #f1f6f4; --brand: #5fb3a3;
    --notice: #f08470; --hot: #f2884f; --tint: #1e2824; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --ink: #e5ebe8; --muted: #8b9993; --line: #2a3531;
  --head: #15302b; --head2: #1b3d36; --head-ink: #f1f6f4; --brand: #5fb3a3;
  --notice: #f08470; --hot: #f2884f; --tint: #1e2824; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.in { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrapmax { max-width: 760px; margin: 0 auto; }

/* 헤더 */
.top { background: var(--head); color: var(--head-ink); }
.top .in { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.logo { display: flex; align-items: center; gap: 4px; font-family: var(--font-display); font-size: 21px; letter-spacing: -0.02em; flex: none; line-height: 1; }
.logo svg { width: 24px; height: 24px; }
.search { flex: 1; min-width: 0; display: flex; align-items: stretch; background: var(--surface); color: var(--ink); border-radius: 2px; overflow: hidden; height: 36px; }
.search .ham { width: 36px; display: grid; place-items: center; border-right: 1px solid var(--line); color: var(--muted); background: var(--tint); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 9px; outline: none; font-size: 14px; }
.search input::placeholder { color: var(--muted); }
.search .go { width: 34px; display: grid; place-items: center; color: var(--brand); }
.search .recent { display: flex; align-items: center; padding: 0 10px; border-left: 1px solid var(--line); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
.menu { background: var(--head2); color: var(--head-ink); }
.menu .in { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; }
.menu .in::-webkit-scrollbar { display: none; }
.menu a { padding: 9px 0; font-weight: 700; white-space: nowrap; opacity: .82; font-size: 15px; }
.menu a.on { opacity: 1; box-shadow: inset 0 -3px 0 var(--head-ink); }

/* 갤러리 제목줄 */
.gal { background: var(--surface); border-bottom: 1px solid var(--line); }
.gal .in { display: flex; align-items: center; gap: 5px; padding-block: 9px; }
.gal h1 { font-size: 17px; font-weight: 700; margin: 0; letter-spacing: -0.04em; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.badge-m { flex: none; width: 19px; height: 19px; border: 2px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; line-height: 1; }
.count { color: var(--muted); font-size: 11px; white-space: nowrap; }
.gal .sp { flex: 1; min-width: 0; }
.gal .lnk { font-size: 12.5px; padding: 2px 5px; white-space: nowrap; position: relative; }
.gal .lnk + .lnk { border-left: 1px solid var(--line); }
.gal .info { width: 18px; height: 18px; color: var(--muted); flex: none; }
.gal .nd { display: inline-grid; place-items: center; width: 11px; height: 11px; border-radius: 50%; background: var(--notice); color: #fff; font-size: 7.5px; font-weight: 700; margin-left: 2px; vertical-align: 5px; }
.write { border: 1.5px solid var(--brand); color: var(--brand); font-weight: 700; padding: 6px 11px; border-radius: 1px; white-space: nowrap; font-size: 13.5px; margin-left: 4px; }
@media (max-width: 359px) { .gal .info { display: none; } }

/* 탭 */
.tabs { background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs .in { display: flex; align-items: stretch; }
.tabs .t { flex: 1; text-align: center; padding: 9px 0; font-weight: 700; font-size: 16px; position: relative; }
.tabs .t + .t::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 1px; background: var(--line); }
.tabs .t.on { color: var(--brand); box-shadow: inset 0 -3px 0 var(--brand); }
.tabs .n { display: flex; align-items: center; gap: 4px; padding-left: 14px; color: var(--ink); font-size: 14px; }
.tabs .n svg { color: var(--muted); }
.cats { background: var(--surface); border-bottom: 5px solid var(--bg); }
.cats .in { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; }
.cats .in::-webkit-scrollbar { display: none; }
.cats button { padding: 9px 0; white-space: nowrap; font-size: 14px; color: var(--ink); }
.cats button.on { font-weight: 700; }

/* 목록: 오른쪽 댓글 열을 화면 끝까지 */
.list { background: var(--surface); }
.list .wrapmax { padding-block: 0; }
.row { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
.row .body { flex: 1; min-width: 0; padding: 7px 8px 7px max(16px, env(safe-area-inset-left, 0px)); }
.row .ttl { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 15px; line-height: 1.35; }
.row .ttl .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .meta { margin-top: 2px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: nowrap; white-space: nowrap; overflow: hidden; }
.row .meta i { font-style: normal; padding: 0 6px; opacity: .45; font-size: 10px; align-self: center; }
.row .cm { flex: none; width: 42px; padding-right: env(safe-area-inset-right, 0px); text-align: center; color: var(--notice); font-size: 13px; background: var(--tint); display: flex; align-items: center; justify-content: center; }
.row.pin .body { padding-block: 6px; }
.row.pin .ttl .t { font-size: 15px; }
.row.pin.hot .ttl .t { color: var(--hot); font-weight: 700; }
.tag { flex: none; font-size: 12px; font-weight: 700; line-height: 1; padding: 5px 8px; border: 1.5px solid; border-radius: 99px; position: relative; }
.tag.notice { color: var(--notice); border-color: var(--notice); }
.tag.poll { color: var(--hot); border-color: var(--hot); }
.tag.poll::after { content: ""; position: absolute; left: -3px; top: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--notice); }
.ic { flex: none; width: 17px; height: 17px; border-radius: 50%; background: #c6cfca; color: var(--surface); display: grid; place-items: center; }
.ic svg { width: 11px; height: 11px; }
.ic.img { background: #2fa866; border-radius: 4px; }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }
.em { font-size: 12px; margin-left: 1px; }

.pager { display: flex; justify-content: center; gap: 4px; padding: 16px 0 90px; }
.pager button { min-width: 32px; height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 2px; color: var(--muted); }
.pager button.on { border-color: var(--brand); color: var(--brand); font-weight: 700; }

.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; border-radius: 50%; background: var(--brand); color: var(--head-ink); display: grid; place-items: center; box-shadow: 0 3px 12px rgba(0,0,0,.28); z-index: 5; }
:root[data-theme="dark"] .fab { color: #0e1613; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fab { color: #0e1613; } }

/* 글 상세 */
.pv { background: var(--surface); }
.pv .in { padding-block: 0; }
.bleed { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pv-head { padding: 13px 0 11px; border-bottom: 1px solid var(--line); }
.pv-title { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.4; letter-spacing: -0.02em; word-break: break-word; }
.pv-title .tag { margin-right: 6px; vertical-align: 1px; }
.pv-sub { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 14px; min-width: 0; }
.pv-sub .nm { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pv-sub .dt { color: var(--muted); white-space: nowrap; }
.pv-sub .sp { flex: 1; }
.pv-sub .scrap { width: 30px; height: 30px; color: var(--muted); display: grid; place-items: center; flex: none; }
.pv-sub .scrap svg { width: 22px; height: 22px; }
.pv-pill { border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; font-size: 13px; white-space: nowrap; flex: none; }
.pv-stats { display: flex; align-items: center; gap: 8px; padding: 10px 0 12px; color: var(--muted); font-size: 14px; }
.pv-stats .sep { opacity: .4; font-size: 10px; }
.pv-stats .cpill { border: 1px solid var(--line); border-radius: 99px; padding: 3px 11px; font-size: 13px; background: var(--tint); }
.pv-stats .cpill b { color: var(--notice); font-weight: 400; margin-left: 3px; }
.pv-body { padding: 4px 0 26px; font-size: 16.5px; line-height: 1.65; min-height: 110px; word-break: break-word; }
.pv-body p { margin: 0 0 .75em; }
.concept { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 8px 0 14px; }
.concept .cnt { color: var(--brand); font-weight: 700; font-size: 16px; }
.concept .btn { width: 64px; height: 64px; border-radius: 50%; background: var(--brand); color: var(--head-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; font-weight: 700; }
.concept .btn svg { width: 26px; height: 26px; }
.pv-act { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; border: 1px solid var(--line); background: var(--tint); margin: 4px 0 18px; padding: 8px 4px; }
.pv-act button { display: flex; align-items: center; gap: 5px; padding: 5px 9px; color: var(--muted); font-size: 14px; }
.pv-act svg { width: 19px; height: 19px; }
.pv-act .rd { color: var(--notice); }
.pv-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 14px; }
.pv-btns button { height: 42px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15.5px; }
.pv-btns .primary { background: var(--brand); border-color: var(--brand); color: var(--head-ink); }
:root[data-theme="dark"] .pv-btns .primary, :root[data-theme="dark"] .pc-tools .go { color: #0e1613; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pv-btns .primary, :root:not([data-theme="light"]) .pc-tools .go { color: #0e1613; } }
.pv-ch { display: flex; align-items: center; gap: 6px; padding-block: 11px; border-top: 5px solid var(--bg); border-bottom: 5px solid var(--bg); font-weight: 700; font-size: 17px; }
.pv-ch .n { color: var(--notice); font-weight: 400; }
.pv-ch svg { width: 20px; height: 20px; color: var(--muted); }
.pv-ch .sp { flex: 1; }
.pv-ch .sort { font-weight: 400; font-size: 14px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.pv-ch .sort i { font-style: normal; opacity: .35; }
.pc { padding: 11px 0 10px; border-bottom: 1px solid var(--line); }
.pc .nm { font-size: 15px; }
.pc p { margin: 3px 0 0; font-size: 15.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.pc .tm { margin-top: 4px; font-size: 13px; color: var(--muted); }
.pc-empty { padding: 20px 0; text-align: center; color: var(--muted); border-bottom: 1px solid var(--line); }
.pc-form { border: 1px solid #aeb9b4; margin: 12px 0 22px; background: var(--surface); }
.pc-top { display: flex; border-bottom: 1px solid var(--line); }
.pc-top > div { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
.pc-top > div + div { border-left: 1px solid var(--line); }
.pc-top input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 11px 12px; font-size: 15px; outline: none; }
.pc-top input.nm { color: var(--brand); padding-right: 40px; }
.pc-top .clr { position: absolute; right: 8px; width: 24px; height: 24px; border-radius: 50%; background: #c5cdc9; color: var(--surface); font-size: 16px; line-height: 1; display: grid; place-items: center; }
.pc-ta { display: block; width: 100%; min-height: 104px; border: 0; background: transparent; padding: 12px; resize: vertical; outline: none; font-size: 15.5px; line-height: 1.5; }
.pc-tools { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-top: 1px solid var(--line); }
.pc-tools .sp { flex: 1; }
.pc-tools .tl { width: 32px; height: 32px; border: 1.5px solid var(--muted); border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 16px; }
.pc-tools .go { height: 32px; padding: 0 20px; background: var(--brand); color: var(--head-ink); font-weight: 700; }

/* 글쓰기 화면 */
.wv { background: var(--surface); }
.wv .in { padding-block: 0; }
.wv-head { display: flex; align-items: center; gap: 8px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.wv-head h2 { margin: 0; flex: 1; font-size: 19px; }
.wv-head button { height: 36px; padding: 0 16px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.wv-head .reg { border: 1.5px solid var(--brand); color: var(--brand); min-width: 92px; }
.wv-id { display: flex; border-bottom: 1px solid var(--line); }
.wv-id > div { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; }
.wv-id > div + div { border-left: 1px solid var(--line); }
.wv-id input { width: 100%; min-width: 0; border: 0; background: transparent; padding: 14px 4px; font-size: 16px; outline: none; }
.wv-id input.nm { color: var(--brand); padding-right: 44px; }
.wv-id .clr { position: absolute; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: #c5cdc9; color: var(--surface); font-size: 17px; line-height: 1; display: grid; place-items: center; }
.wv-cats { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; border-bottom: 1px solid var(--line); }
.wv-cats::-webkit-scrollbar { display: none; }
.wv-cats button { flex: none; padding: 10px 18px; background: var(--tint); font-size: 15.5px; white-space: nowrap; }
.wv-cats button.on { background: var(--brand); color: var(--head-ink); }
:root[data-theme="dark"] .wv-cats button.on, :root[data-theme="dark"] .wv-head .reg { color: #0e1613; }
:root[data-theme="dark"] .wv-head .reg { color: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wv-cats button.on { color: #0e1613; } }
.wv-title input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 15px 0; font-size: 16.5px; outline: none; }
.wv-tools { display: flex; align-items: center; gap: 8px; padding: 8px 0; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.wv-tools select { height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 3px; padding: 0 8px; font-size: 15px; }
.wv-tools .grp { display: flex; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); overflow: hidden; }
.wv-tools .grp button { min-width: 38px; height: 36px; font-size: 18px; display: grid; place-items: center; }
.wv-tools .grp button + button { border-left: 1px solid var(--line); }
.wv-tools .hl { background: #fff200; color: #000; padding: 0 2px; }
.wv-editor { min-height: 340px; padding: 14px 0 20px; outline: none; line-height: 1.6; word-break: break-word; }
.wv-editor:empty::before { content: attr(data-ph); color: var(--muted); }
.wv-editor mark { background: #fff200; color: #000; }
.wv-icons { display: flex; align-items: center; gap: 14px; padding-block: 12px; overflow-x: auto; scrollbar-width: none; border-top: 5px solid var(--bg); border-bottom: 1px solid var(--line); }
.wv-icons::-webkit-scrollbar { display: none; }
.wv-icons button { flex: none; width: 40px; height: 40px; }
.wv-icons svg { width: 100%; height: 100%; }
.wv-notes { margin: 0 0 0; padding-block: 12px 26px; list-style: none; background: var(--tint); font-size: 13.5px; line-height: 1.6; }
.wv-notes li::before { content: "* "; color: var(--muted); }
.pv-body mark { background: #fff200; color: #000; }

/* 깨진 폰 화면 테마: 어두운 바탕 위에 세로 줄과 금이 겹쳐 보이고, 내용은 그대로 읽힙니다. */
:root:root:root { --bg:#04060a; --surface:#0a0e12; --ink:#e8eef0; --muted:#8d99a0; --line:#1b242a; --head:#0b221e; --head2:#102c27; --head-ink:#eaf6f3; --brand:#4fc2aa; --notice:#ff6b5a; --hot:#ff9a4d; --tint:#10171b; color-scheme: dark; }
html { background: #000; }
body { max-width: 480px; margin: 0 auto; min-height: 100vh; }
.fab { right: max(16px, calc((100vw - 480px) / 2 + 16px)); color: #04120f; }
.pv-btns .primary, .pc-tools .go, .concept .btn, .wv-cats button.on { color: #04120f; }
.pc-form { border-color: #2c3a41; }
.toast { z-index: 40; }

/* 깨진 화면 질감: 어두운 막 → 빛나는 줄과 금(번짐 포함) → 액정 픽셀 격자 순으로 겹칩니다. */
.glass-dark, .broken-screen, .glass-grid { position: fixed; top: 0; bottom: 0; left: 50%; width: min(100vw, 480px); transform: translateX(-50%); pointer-events: none; }
.glass-dark { z-index: 28; background: radial-gradient(ellipse at 50% 38%, transparent 52%, rgba(0,0,0,.55) 100%); }
.glass-dark svg, .broken-screen svg { display: block; width: 100%; height: 100%; }
.broken-screen { z-index: 30; mix-blend-mode: screen; opacity: .36; }
.glass-grid { z-index: 31; background:
  repeating-linear-gradient(90deg, rgba(255,40,40,.085) 0 1px, rgba(40,255,60,.07) 1px 2px, rgba(60,90,255,.1) 2px 3px),
  repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0 1px, transparent 1px 3px); }
body { text-shadow: .55px 0 rgba(255,70,70,.3), -.55px 0 rgba(70,140,255,.3); }
.fl { animation: dying 3.4s steps(1, end) infinite; }
@keyframes dying { 0%, 100% { opacity: .9; } 40% { opacity: .15; } 44% { opacity: .9; } 71% { opacity: .1; } 74% { opacity: .85; } }
@media (prefers-reduced-motion: reduce) { .fl { animation: none; } }
/* 관리자 편집 */
.adm-bar { position: fixed; left: max(16px, calc((100vw - 480px) / 2 + 16px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 45; display: flex; gap: 6px; }
.adm-bar button { height: 36px; padding: 0 13px; border-radius: 99px; background: #e8eef0; color: #04120f; font-size: 13px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.5); text-shadow: none; }
.adm-bar button.on { background: var(--notice); color: #fff; }
.adm-act, .pv-adm { display: flex; gap: 6px; padding: 5px max(16px, env(safe-area-inset-left, 0px)) 7px; border-bottom: 1px solid var(--line); background: var(--tint); }
.pv-adm { padding-inline: 0; }
.adm-act button, .pv-adm button, .pc-adm button { font-size: 12px; font-weight: 700; padding: 4px 10px; border: 1px solid var(--line); border-radius: 2px; background: var(--surface); }
.adm-act button.warn, .pv-adm button.warn, .pc-adm button.warn { color: var(--notice); border-color: var(--notice); }
.pc-adm { display: flex; gap: 6px; margin-top: 6px; }

/* 방문자가 쓴 글은 메모리에만 있으므로, 새로 열었을 때 글 상세나 글쓰기 주소로 시작하면 목록으로 보냅니다. */
if (/^#post-\d+$/.test(location.hash) && !byId(parseInt(location.hash.slice(6), 10))) { location.hash = ""; }
route();
