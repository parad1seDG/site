:root:root:root { --bg:#04060a; --surface:#0a0e12; --ink:#e8eef0; --muted:#8d99a0; --line:#1b242a; --head:#0b221e; --head2:#102c27; --head-ink:#eaf6f3; --brand:#4fc2aa; --notice:#ff6b5a; --hot:#ff9a4d; --tint:#10171b; color-scheme: dark; }

function matches(p) {
  if (state.tab === "hot" && !p.hot) return false;
  if (state.tab === "notice" && !p.notice) return false;
  if (state.cat !== "전체" && p.cat !== state.cat) return false;
  if (state.q && (p.title + p.name).toLowerCase().indexOf(state.q.toLowerCase()) < 0) return false;
  return true;
}
function rowHtml(p) {
  var isPin = p.notice || p.cat === "설문";
  var pin = isPin ? " pin" + (p.hot || p.cat === "설문" ? " hot" : "") : "";
  var icon = isPin ? "" : '<span class="ic' + (p.img ? " img" : "") + '">' + (p.img ? imgSvg : iconSvg) + "</span>";
  var meta = isPin ? "" :
    '<div class="meta"><span>' + catLabel(p.cat) + "</span><i>|</i><span>" + esc(p.name) + "</span><i>|</i><span>" + esc(p.time) + "</span><i>|</i><span>조회 " + p.views + "</span><i>|</i><span>추천 " + p.up + "</span></div>";
  var cm = '<span class="cm">' + (isPin && p.cat === "설문" ? "" : cmCount(p)) + "</span>";
  return '<a class="row' + pin + '" href="#post-' + p.id + '"><div class="body"><div class="ttl">' + tagFor(p) + icon + '<span class="t">' + esc(p.title) + "</span></div>" + meta + "</div>" + cm + "</a>";
}
function renderList() {
  var notices = POSTS.filter(function (p) { return p.notice && matches(p); });
  var polls = POSTS.filter(function (p) { return !p.notice && p.cat === "설문" && matches(p); });
  var normal = POSTS.filter(function (p) { return !p.notice && p.cat !== "설문" && matches(p); });
  var html = notices.concat(polls, normal).map(rowHtml).join("");
  $("#rows").innerHTML = html || '<div class="empty">조건에 맞는 글이 없습니다.</div>';
  $("#pager").innerHTML = '<button class="on">1</button><button data-toast="마지막 페이지입니다">다음</button>';
  document.querySelectorAll(".tabs .t").forEach(function (b) { b.classList.toggle("on", b.dataset.tab === state.tab); });
  $("#cats").innerHTML = CATS.map(function (c) { return '<button class="' + (c === state.cat ? "on" : "") + '" data-cat="' + c + '">' + (c === "전체" ? "전체" : catLabel(c)) + "</button>"; }).join("");
}

function renderPost(id) {
  var p = byId(id);
  if (!p) { location.hash = ""; return; }
  var title = (p.notice ? tagFor(p) : '<span class="cat">[' + esc(p.cat) + (EMO[p.cat] || "") + "]</span> ") + esc(p.title);
  var cms = (p.comments || []).map(function (c) {
    return '<div class="pc"><div class="nm">' + esc(c.name) + "</div><p>" + esc(c.text) + '</p><div class="tm">' + esc(c.time) + "</div></div>";
  }).join("");
  var bodyHtml = p.bodyHtml
    ? '<div class="pv-body" style="font-size:' + (p.fs || 16) + "px;text-align:" + (p.ta || "left") + '">' + p.bodyHtml + "</div>"
    : '<div class="pv-body">' + (p.body || []).map(function (t) { return "<p>" + esc(t) + "</p>"; }).join("") + "</div>";
  $("#postBody").innerHTML =
    '<div class="pv-head"><h2 class="pv-title">' + title + "</h2>" +
    '<div class="pv-sub"><span class="nm">' + esc(p.name) + '</span><span class="dt">' + esc(fullDate(p)) + '</span><span class="sp"></span><button class="scrap" data-act="scrap" aria-label="스크랩">' + SV.scrap + '</button><button class="pv-pill" id="pvGal">갤로그가기</button></div></div>' +
    '<div class="pv-stats"><span>조회수 ' + p.views + '</span><span class="sep">|</span><span>추천 ' + p.up + '</span><span class="sep">|</span><span class="cpill">댓글<b>' + cmCount(p) + "</b></span></div>" +
    bodyHtml +
    '<div class="concept"><span class="cnt">' + p.up + '</span><button class="btn" data-act="concept" aria-label="개념글 추천">' + SV.star + "개념</button></div>" +
    '<div class="pv-act"><button data-act="down">' + SV.down + '비추</button><button data-act="share">' + SV.share + '공유</button><button data-act="scrap">' + SV.scrap + '스크랩</button><button data-act="report"><span class="rd" style="display:flex;align-items:center;gap:5px">' + SV.report + "신고</span></button></div>" +
    '<div class="pv-btns"><button id="pvList">목록보기</button><button class="primary" id="pvWrite">글쓰기</button></div>' +
    '<div class="pv-ch bleed">댓글 <span class="n">[' + cmCount(p) + "]</span>" + SV.refresh + '<span class="sp"></span><span class="sort">본문<i>|</i><span style="display:flex;align-items:center;gap:2px">등록순' + SV.chev + "</span></span></div>" +
    (cms || '<div class="pc-empty">첫 댓글을 남겨보세요.</div>') +
    '<form class="pc-form" id="cmtForm"><div class="pc-top"><div><input id="cmtName" class="nm" type="text" value="병동환자" aria-label="닉네임"><button type="button" class="clr" id="cmtClr" aria-label="지우기">×</button></div><div><input id="cmtPw" type="password" placeholder="비밀번호" aria-label="비밀번호"></div></div>' +
    '<textarea id="cmtIn" class="pc-ta" placeholder="댓글을 입력해주세요." aria-label="댓글"></textarea>' +
    '<div class="pc-tools"><button type="button" class="tl" data-toast="준비 중입니다" aria-label="이모티콘">☺</button><button type="button" class="tl" data-toast="준비 중입니다" aria-label="서식">T</button><span class="sp"></span><button type="submit" class="go">등록</button></div></form>';
  var rest = POSTS.filter(function (x) { return x.id !== id && !x.notice; }).slice(0, 10);
  $("#rows2").innerHTML = rest.map(rowHtml).join("");
  $("#cmtClr").addEventListener("click", function () { $("#cmtName").value = ""; $("#cmtName").focus(); });
  $("#cmtForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = $("#cmtIn").value.trim();
    if (!text) { toast("내용을 입력해주세요"); return; }
    p.comments = p.comments || [];
    p.comments.push({ name: $("#cmtName").value.trim() || "병동환자", time: stamp(), text: text });
    renderPost(id);
    toast("댓글을 등록했습니다");
  });
  $("#pvList").addEventListener("click", function () { location.hash = ""; });
  $("#pvWrite").addEventListener("click", function () { location.hash = "write"; });
  $("#pvGal").addEventListener("click", function () { toast("갤로그가 없습니다"); });
}

/* ---------------- 글쓰기 ---------------- */
function clean(node) {
  var out = "";
  node.childNodes.forEach(function (n) {
    if (n.nodeType === 3) { out += esc(n.textContent); return; }
    if (n.nodeType !== 1) return;
    var t = n.tagName.toLowerCase(), inner = clean(n);
    if (t === "br") out += "<br>";
    else if (t === "div" || t === "p") out += (out && !/<br>$/.test(out) ? "<br>" : "") + inner;
    else if (t === "b" || t === "strong") out += "<b>" + inner + "</b>";
    else if (t === "i" || t === "em") out += "<i>" + inner + "</i>";
    else if (t === "u") out += "<u>" + inner + "</u>";
    else if (t === "s" || t === "strike" || t === "del") out += "<s>" + inner + "</s>";
    else if (t === "span" && n.style && n.style.backgroundColor) out += "<mark>" + inner + "</mark>";
    else out += inner;
  });
  return out;
}
function renderWrite() {
  wv = { cat: "일반", fs: 16, ta: "left" };
  var sizes = [12, 14, 16, 18, 20, 24];
  $("#writeBody").innerHTML =
    '<div class="wv-head"><h2>글쓰기</h2><button type="button" id="wTemp">임시</button><button type="button" class="reg" id="wReg">등록</button></div>' +
    '<div class="wv-id"><div><input id="wName" class="nm" type="text" value="병동환자" maxlength="20" aria-label="닉네임"><button type="button" class="clr" id="wClr" aria-label="지우기">×</button></div><div><input id="wPw" type="password" placeholder="비밀번호" aria-label="비밀번호"></div></div>' +

    '<div class="wv-title"><input id="wTitle" type="text" placeholder="제목" maxlength="100" aria-label="제목"></div>' +
    '<div class="wv-tools"><select id="wSize" aria-label="글자 크기">' + sizes.map(function (s) { return "<option" + (s === wv.fs ? " selected" : "") + ">" + s + "</option>"; }).join("") + "</select>" +
    '<div class="grp"><button type="button" data-cmd="bold" style="font-weight:700" aria-label="굵게">가</button><button type="button" data-cmd="underline" style="text-decoration:underline" aria-label="밑줄">가</button><button type="button" data-cmd="italic" style="font-style:italic" aria-label="기울임">가</button><button type="button" data-cmd="strikeThrough" style="text-decoration:line-through" aria-label="취소선">가</button></div>' +
    '<div class="grp"><button type="button" data-cmd="hilite" aria-label="형광펜"><span class="hl">가</span></button></div>' +
    '<div class="grp"><button type="button" id="wAlign" aria-label="정렬"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h16"/></svg></button></div>' +
    '<div class="grp"><button type="button" data-toast="준비 중입니다" aria-label="링크"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg></button></div></div>' +
    '<div id="wEditor" class="wv-editor" contenteditable="true" data-ph="내용" role="textbox" aria-label="내용" style="font-size:16px"></div>' +
    '<div class="wv-icons bleed"><button type="button" data-toast="사진 첨부는 준비 중입니다" aria-label="사진">' + SV.image + '</button><button type="button" data-toast="동영상 첨부는 준비 중입니다" aria-label="동영상">' + SV.video + '</button><button type="button" data-toast="준비 중입니다" aria-label="이모티콘" style="color:var(--ink)">' + SV.smile + '</button><button type="button" data-toast="준비 중입니다" aria-label="유튜브">' + SV.yt + '</button><button type="button" data-toast="준비 중입니다" aria-label="추가">' + SV.grid + '</button><button type="button" data-toast="준비 중입니다" aria-label="투표">' + SV.bars + '</button><button type="button" data-toast="준비 중입니다" aria-label="설정">' + SV.gear + "</button></div>" +
    '<ul class="wv-notes bleed"><li>쉬운 비밀번호를 입력하면 타인의 수정, 삭제가 쉽습니다.</li><li>이미지 파일은 개당 20MB까지 업로드 가능합니다.</li><li>서로를 존중하는 글을 작성해주세요.</li></ul>';
  var ed = $("#wEditor");
  $("#wClr").addEventListener("click", function () { $("#wName").value = ""; $("#wName").focus(); });
  $("#wCats").addEventListener("click", function (e) {
    var b = e.target.closest("[data-wc]"); if (!b) return;
    wv.cat = b.dataset.wc;
    document.querySelectorAll("#wCats button").forEach(function (x) { x.classList.toggle("on", x === b); });
  });
  $("#wSize").addEventListener("change", function (e) { wv.fs = parseInt(e.target.value, 10); ed.style.fontSize = wv.fs + "px"; });
  $("#wAlign").addEventListener("click", function () {
    var order = ["left", "center", "right"];
    wv.ta = order[(order.indexOf(wv.ta) + 1) % 3]; ed.style.textAlign = wv.ta;
    toast({ left: "왼쪽 정렬", center: "가운데 정렬", right: "오른쪽 정렬" }[wv.ta]);
  });
  document.querySelectorAll("[data-cmd]").forEach(function (b) {
    b.addEventListener("mousedown", function (e) { e.preventDefault(); });
    b.addEventListener("click", function () {
      ed.focus();
      try {
        if (b.dataset.cmd === "hilite") { document.execCommand("styleWithCSS", false, true); document.execCommand("hiliteColor", false, "#fff200"); document.execCommand("styleWithCSS", false, false); }
        else { document.execCommand(b.dataset.cmd); }
      } catch (x) {}
    });
  });
  ed.addEventListener("paste", function (e) {
    e.preventDefault();
    var t = (e.clipboardData || window.clipboardData).getData("text");
    document.execCommand("insertText", false, t);
  });
  $("#wTemp").addEventListener("click", function () { toast("임시 저장했습니다"); });
  $("#wReg").addEventListener("click", function () {
    var title = $("#wTitle").value.trim();
    if (!title) { toast("제목을 입력해주세요"); return; }
    if (!ed.textContent.trim()) { toast("내용을 입력해주세요"); return; }
    var np = {
      id: POSTS.reduce(function (mx, x) { return Math.max(mx, x.id); }, 0) + 1,
      cat: wv.cat, title: title, name: $("#wName").value.trim() || "병동환자", time: nowTime(),
      views: 1, up: 0, bodyHtml: clean(ed), fs: wv.fs, ta: wv.ta, comments: []
    };
    var firstNormal = POSTS.findIndex(function (x) { return !x.notice; });
    POSTS.splice(firstNormal < 0 ? POSTS.length : firstNormal, 0, np);
    toast("글이 등록되었습니다");
    location.hash = "post-" + np.id;
  });
}

function route() {
  var h = location.hash, m = /^#post-(\d+)$/.exec(h);
  $("#listView").hidden = true; $("#postView").hidden = true; $("#writeView").hidden = true;
  document.querySelector(".gal").hidden = (h === "#write");
  if (h === "#write") {
    $("#writeView").hidden = false; renderWrite();
  } else if (m) {
    $("#postView").hidden = false; renderPost(parseInt(m[1], 10));
  } else {
    $("#listView").hidden = false; renderList();
  }
  window.scrollTo(0, 0);
}
var toastTimer;
function toast(msg) {
  var t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
}

document.addEventListener("click", function (e) {
  var b;
  if ((b = e.target.closest("[data-act]"))) {
    var act = b.dataset.act;
    if (act === "share") {
      try { navigator.clipboard.writeText(location.href).then(function () { toast("주소를 복사했습니다"); }, function () { toast("주소를 복사하지 못했습니다"); }); } catch (x) { toast("주소를 복사하지 못했습니다"); }
    } else { toast({ scrap: "스크랩했습니다", concept: "추천했습니다", down: "비추천 권한이 없습니다", report: "신고가 접수되었습니다" }[act]); }
    return;
  }
  var el = e.target.closest("[data-toast]");
  if (el) { e.preventDefault(); toast(el.dataset.toast); return; }
  var tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; renderList(); return; }
  var cat = e.target.closest("[data-cat]");
  if (cat) { state.cat = cat.dataset.cat; renderList(); return; }
  if (e.target.closest("#writeTop, #writeFab")) { location.hash = "write"; }
});
$("#searchForm").addEventListener("submit", function (e) {
  e.preventDefault(); state.q = $("#q").value.trim(); state.tab = "all"; state.cat = "전체";
  if (location.hash) { location.hash = ""; } else { renderList(); }
});
window.addEventListener("hashchange", route);
/* 방문자가 쓴 글은 메모리에만 있으므로, 새로 열었을 때 글 상세나 글쓰기 주소로 시작하면 목록으로 보냅니다. */
if (/^#post-\d+$/.test(location.hash) && !byId(parseInt(location.hash.slice(6), 10))) { location.hash = ""; }
route();
